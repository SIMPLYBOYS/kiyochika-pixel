<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>清親《東京名所圖》— 光線畫的地圖</title>
<style>
  :root { --sea:#1b3a56; --land:#e9e1cf; --ink:#2a2622; --river:#4d7fa3; --gold:#c9a227;
          /* 圖框外。與 --sea 同色系但更暗——不然灣內的海會跟框外連成一片 */
          --off:#101d29; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--off); color:var(--land); height:100vh; height:100dvh; overflow:hidden;
         font-family:"Hiragino Mincho ProN","Yu Mincho",serif }
  #map { display:block; width:100vw; height:100vh; height:100dvh; cursor:grab; touch-action:none }
  #map:active { cursor:grabbing }

  /* 標記整組由 map.js 套 scale() 縮回螢幕尺度，所以這裡的數字就是螢幕像素 */
  .mark { cursor:pointer }
  /* 🔴 pointer-events:all——空心圓（下面的 .approx）的中心是**洞**，
     SVG 的 fill:none 不接 hit-test，點下去會穿過去打到底下的地形圖。
     59 個標記裡有 32 個是空心的，也就是一半以上只有那圈 2px 的線點得到。 */
  .mark circle.dot { fill:var(--gold); opacity:.85; transition:opacity .3s; pointer-events:all }
  /* 兩層閘門畫在點上。還沒出版的整個不存在——地圖隨年份長出來是看得見的那一半 */
  .mark.unpub { display:none }
  /* 收不了的退到背景去：可收的是金的、亮的、會動的，其餘越安靜越好 */
  .mark.closed circle.dot { fill:var(--ink); opacity:.32 }
  .mark.closed.approx circle.dot { fill:none; stroke:var(--ink); opacity:.32 }
  .mark.got circle.dot { fill:#7a9a6d; opacity:.9 }
  .mark.got.approx circle.dot { fill:none; stroke:#7a9a6d }
  #map.zoomed .mark.got text { fill:#4f6b45 }
  /* 可收的點：靜態暈 ＋ 擴散漣漪 ＋ 白邊。慢、淡、錯開——這是水墨調的地圖，不是通知紅點。
     ⛔ 不能只靠動畫：關掉動態效果的人要看得到同一件事，所以 halo 是靜態的。 */
  .mark .halo, .mark .pulse { fill:var(--gold); opacity:0; pointer-events:none }
  .mark.open .halo { opacity:.2 }
  .mark.open circle.dot { opacity:1; stroke:#fffdf5; stroke-width:1.5 }
  .mark.open.approx circle.dot { fill:var(--land); opacity:1 }   /* 空心的也要看得出是金點 */
  .mark.open .pulse { animation:ripple 2.8s ease-out infinite }
  @keyframes ripple { 0% { transform:scale(1); opacity:.5 } 60%,100% { transform:scale(3.4); opacity:0 } }
  @media (prefers-reduced-motion:reduce) {
    .mark.open .pulse { animation:none }
    .mark.open .halo { opacity:.3 }     /* 不會動就畫得明顯一點 */
  }
  /* 🔴 只定到「那一帶」的座標畫成空心。實心＝查到題名說的那個地物本身
     （OSM id 或 Wikidata QID），空心＝只知道在這一區。
     兩種畫成一樣，就是在地圖上把沒查證的事講得跟查證過的一樣確定。 */
  .mark.approx circle.dot { fill:none; stroke:var(--gold); stroke-width:2; opacity:.75 }
  .mark text { font-size:13px; fill:var(--ink); opacity:0; paint-order:stroke;
               stroke:var(--land); stroke-width:4; pointer-events:none; transition:opacity .3s }
  #map.zoomed .mark text { opacity:.95 }
  /* 被避讓擠掉的景名。用 class 而非 inline display，:hover 才叫得回來 */
  #map.zoomed .mark text.crowded { opacity:0 }
  .mark:hover circle.dot { stroke:#fffdf5; stroke-width:2.5; opacity:1 }
  .mark:hover text { opacity:1 !important }
  .mark.sel circle.dot { stroke:#fffdf5; stroke-width:3; opacity:1 }
  /* 剛被「帶我去」帶到的那一個：名字亮出來幾秒，免得玩家還要在一堆點裡認 */
  .mark.lead circle.dot { stroke:#fffdf5; stroke-width:3; opacity:1 }
  .mark.lead text { opacity:1 !important }
  .mark.lead .halo { opacity:.42 }
  .mark.sel text { opacity:1 !important }
  /* 視線扇形：畫成扇不畫成箭頭，因為方位有不確定度。目前 69 幅都還沒有方位角 */
  .mark .cone { fill:var(--gold); opacity:.22; pointer-events:none }

  /* 地名。font-size 與 stroke-width 由 map.js 每次縮放時設在 #places 上，
     用來抵銷 viewBox 縮放——寫死在這裡的話一拉近字就變巨大。 */
  #places text { fill:#33506b; paint-order:stroke; stroke:var(--land);
                 text-anchor:middle; pointer-events:none; opacity:.8 }
  #places .river, #places .canal { font-style:italic }
  /* 明治 15 区與現代 23 区：都是「這裡叫什麼」的註腳，不跟水系搶份量 */
  #places .ku { fill:#7a5c3a; opacity:.72; letter-spacing:.18em }
  #places .city { fill:#5b7188; opacity:.62; letter-spacing:.18em }

  /* 🔴 HUD 蓋在**淺色**的地圖上，不是深色底。
     原本沿用 edo-hyakkei 的漸層（#0e2233dd → transparent），那邊的地圖上緣是海，
     這裡上緣是米色的陸地——同一段 CSS 在這張圖上等於白字印在白紙上。
     改成自己帶底的一小條，不靠地圖的顏色。 */
  /* 🔴 一列裝不下就**橫著捲**，⛔ 不要折行：折行之後 HUD 從 44px 長到 123px
     （實測直式手機），把地圖壓掉一大塊，連「等一刻」三個字都被擠成三行。 */
  #hud { position:fixed; top:0; left:0; padding:8px 14px; display:flex; gap:12px;
         align-items:baseline; pointer-events:none; background:#0e2233e6;
         border-radius:0 0 8px 0; max-width:min(720px,94vw);
         flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none }
  #hud::-webkit-scrollbar { display:none }
  #hud > * { flex:0 0 auto; white-space:nowrap; pointer-events:auto }
  #hud b { font-weight:normal; color:var(--gold); font-size:16px }
  #hud #now { font-size:13px; opacity:.85; letter-spacing:.08em }
  /* 「帶我去」：HUD 那行本身是鈕。⛔ 不做成顯眼的按鈕——它是提示不是主操作 */
  #hud #open { opacity:.75; font-size:11px; font-family:inherit; color:var(--gold);
               background:none; border:0; cursor:pointer; padding:0; letter-spacing:.02em }
  #hud #open:hover:not(:disabled) { opacity:1; text-decoration:underline }
  #hud #open:disabled { opacity:.45; color:inherit; cursor:default }
  #hud button { pointer-events:auto; font-family:inherit; font-size:12px; cursor:pointer;
                background:#ffffff14; color:var(--land); border:1px solid #ffffff33;
                border-radius:5px; padding:3px 10px }
  #hud button:hover { background:#ffffff24 }
  /* 面板開著時 HUD 會被它蓋掉右半邊。留下要緊的（進度・時刻・待つ），
     把附註與外連收起來——被蓋住的鈕比沒有更糟。 */
  body.panel-open #hud small, body.panel-open #hud #open,
  body.panel-open #hud #refmap { display:none }
  #hud #refmap { pointer-events:auto; color:var(--gold); font-size:12px; opacity:.85;
                 white-space:nowrap; text-decoration:none; border-bottom:1px dotted currentColor }
  #hud #refmap:hover { opacity:1 }
  #hud small { opacity:.72; font-size:11px }
  @media (max-width:700px) { #hud small { display:none } }

  #zoom { position:fixed; right:14px; top:50%; transform:translateY(-50%);
          display:flex; flex-direction:column; gap:6px }
  #zoom button { width:38px; height:38px; font-size:16px; cursor:pointer;
                 background:#0e2233cc; color:var(--land); border:1px solid #ffffff33;
                 border-radius:6px; font-family:inherit }
  #zoom button:disabled { opacity:.35; cursor:default }

  /* 🔴 pointer-events:none：這一條是整片的、上半透明，看起來什麼都沒有，
     卻會把落在上面的點擊全吃掉（edo-hyakkei 踩過，一顆按鈕看得到按不到）。
     滑桿自己收回 auto 就好。 */
  #bar { position:fixed; left:0; right:0; bottom:0; padding:12px 20px 16px; text-align:center;
         pointer-events:none; background:linear-gradient(transparent,#0e2233cc 40%) }
  #bar input { pointer-events:auto; width:min(420px,60vw); accent-color:var(--gold);
               vertical-align:middle }
  #bar label { font-size:12px; opacity:.7; margin:0 10px }
  /* 讀數常駐。這條滑桿左＝現代、右＝明治，跟多數人對滑桿的直覺相反，
     淡出的話玩家就沒有線索知道自己現在疊的是哪一層。 */
  #eranow { font-size:12px; height:17px; margin-top:5px; color:var(--gold);
            opacity:.85; letter-spacing:.06em }
  #attr { font-size:10px; opacity:.4; margin-top:4px }   /* ODbL 要求標示出處 */

  /* 🔴 面板要放得下畫。像素畫布一律 480px 寬，而第一版面板只有 460px（內容區 420px）
     ⇒ 每一幅都是縮到 0.875 倍在顯示——比原尺寸還小，而且非整數倍會糊。
     看畫的時候地圖用不到，所以讓它寬。 */
  #panel { position:fixed; right:0; top:0; bottom:0; width:min(1040px,96vw); overflow:auto;
           background:#0e2233f2; border-left:1px solid #ffffff22; padding:18px 20px 28px;
           transform:translateX(102%); transition:transform .25s; }
  #panel.on { transform:none }
  #panel img { display:block; background:#0006; min-height:120px }
  #panel h2 { font-size:19px; font-weight:normal; letter-spacing:.04em }
  #panel dl { display:grid; grid-template-columns:5em 1fr; gap:4px 10px; font-size:12.5px;
              margin-top:10px; line-height:1.55 }
  #panel dt { opacity:.55 } #panel dd { margin:0 }
  /* 「碑」＝ 畫裡那個東西已經沒了，只剩一塊碑。這一條值得看得出來 */
  #panel .mk { color:var(--gold); opacity:.9 }
  #panel a, #card a { color:var(--gold) }
  #panel .wide { width:100%; margin:6px 0; padding:8px; cursor:pointer; font-family:inherit;
                 font-size:13px; background:#ffffff12; color:var(--land);
                 border:1px solid #ffffff30; border-radius:6px }
  #panel .wide:hover { background:#ffffff20 }
  #panel .take { background:var(--gold); color:#2a2410; border-color:var(--gold); font-size:14px }
  #panel .gate { margin:8px 0; padding:8px 10px; font-size:13px; color:#e0c98b;
                 background:#ffffff0f; border-left:2px solid var(--gold); border-radius:0 4px 4px 0 }
  #panel #art { background:#0006; min-height:120px }
  /* 🔴 整個面板是一個欄。欄寬由 main.js 依像素版算出來（--col），
     圖、標題、按鈕、資料全部對齊同一條左邊界——
     第一版只把圖置中、其餘靠左，桌機上差 140px，看起來就是跑版。 */
  #panel > #body { max-width:var(--col,640px); margin:0 auto }
  #panel #art { position:relative; margin:10px 0 }
  #panel #art img { image-rendering:pixelated; display:block }   /* 像素版要銳利，不要被瀏覽器抹平 */
  /* 標註：清親在這裡畫了什麼。像素版與真跡是同一個框（都是和紙），所以兩邊通用 */
  #panel #art.nomarks .spot { display:none }
  #panel .spot { position:absolute; transform:translate(-50%,-50%); font-weight:normal;
                 font-size:11px; color:#2a2410; background:var(--gold); padding:1px 5px;
                 border-radius:9px; white-space:nowrap; pointer-events:none;
                 box-shadow:0 0 0 2px #0008 }
  #panel .hint { font-size:12px; opacity:.75; margin:6px 0 2px }

  /* 原寸檢視。這一格看的是那張版畫本身，所以壓在最上層、背景全暗 */
  .lightbox { position:fixed; inset:0; z-index:30; background:#060d14f2; overflow:hidden;
              display:grid; place-items:center; cursor:grab; touch-action:none }
  .lightbox:active { cursor:grabbing }
  .lightbox img { will-change:transform; max-width:none; max-height:none; height:auto }
  .lightbox .lzoom { position:fixed; right:16px; top:50%; transform:translateY(-50%);
                     display:flex; flex-direction:column; gap:6px }
  .lightbox .lzoom button { width:38px; height:38px; font-size:15px; cursor:pointer;
                            font-family:inherit; background:#0e2233cc; color:var(--land);
                            border:1px solid #ffffff33; border-radius:6px }
  .lightbox .ltip { position:fixed; left:0; right:0; bottom:14px; text-align:center;
                    font-size:12px; opacity:.6; pointer-events:none }
  /* 窄螢幕：控制列改排在下方。豎排在右邊會直接壓在畫上（390px 的螢幕更明顯） */
  @media (max-width:640px) {
    .lightbox .lzoom { flex-direction:row; right:auto; left:50%; top:auto; bottom:46px;
                       transform:translateX(-50%) }
    .lightbox .ltip { bottom:8px; font-size:11px }
  }

  /* ── 沈浸模式 ─────────────────────────────────────────────
     全螢幕 ＋ 把周邊收到很淡，只留地圖。碰到才亮回來（觸控裝置沒有 hover，
     所以是「淡」不是「消失」——按得到才不會變成陷阱）。
     🔴 出處不能收：ODbL 要求標示出處，沈浸模式也一樣 ⇒ 只縮小不隱藏。 */
  body.immersive #hud, body.immersive #zoom, body.immersive #ticker,
  body.immersive #bar label, body.immersive #bar input, body.immersive #eranow {
    opacity:.18; transition:opacity .35s }
  body.immersive #hud:hover, body.immersive #zoom:hover, body.immersive #ticker:hover,
  body.immersive #bar:hover label, body.immersive #bar:hover input,
  body.immersive #bar:hover #eranow { opacity:1 }
  body.immersive #bar { background:none }
  body.immersive #attr { opacity:.3; font-size:9px }      /* ⛔ 出處不隱藏，只縮小 */
  body.immersive #hud { background:#0e223399 }

  /* ── 開場 ─────────────────────────────────────────────────
     這部作品的弧線：1876 的銀座是晴天白日，1881 只剩火與夜。開場依年份放六幅，
     一幅一幅淡入淡出，文字同時緩緩上捲。⛔ 關掉動態效果的人直接看到擺好的版面。 */
  .intro { position:fixed; inset:0; z-index:40; background:#080f16; overflow:hidden;
           display:grid; place-items:center; transition:opacity .4s }
  .intro.out { opacity:0 }
  .intro .ireel { position:absolute; inset:0 }
  .intro .ireel img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; animation:ifade 20.4s linear infinite; will-change:opacity,transform }
  @keyframes ifade {                 /* 六幅 × 3.4s 一輪；各自延遲錯開 */
    0% { opacity:0; transform:scale(1.04) }
    4%,14% { opacity:.55 }
    18%,100% { opacity:0; transform:scale(1.10) }
  }
  .intro .iveil { position:absolute; inset:0;
    background:radial-gradient(ellipse at center,#080f1655,#080f16f0 72%) }
  .intro .itext { position:relative; text-align:center; max-width:min(620px,88vw);
    max-height:82vh; overflow:auto; padding:12px 4px 0;
    animation:irise 1.2s cubic-bezier(.2,.7,.3,1) both }
  @keyframes irise { from { opacity:0; transform:translateY(26px) } to { opacity:1; transform:none } }
  .intro h1 { font-size:clamp(26px,5.4vw,42px); font-weight:normal; letter-spacing:.34em;
              color:var(--gold); margin-bottom:.5em }
  .intro .isub { font-size:12px; letter-spacing:.3em; opacity:.6; margin-bottom:2em }
  .intro .iwho { font-size:16px; letter-spacing:.2em; color:var(--gold); margin:1.4em 0 .6em }
  .intro p { font-size:13.5px; line-height:2.05; opacity:.9; margin:1em 0 }
  .intro .ifact { font-size:12.5px; opacity:.6; margin-top:2em }
  .intro .isrc { font-size:11px; opacity:.4 }
  .intro .ibtn { position:absolute; bottom:26px; left:0; right:0; text-align:center }
  .intro .ibtn button { font-family:inherit; font-size:14px; letter-spacing:.24em; cursor:pointer;
    color:var(--ink); background:var(--gold); border:0; border-radius:6px; padding:9px 34px }
  @media (prefers-reduced-motion:reduce) { .intro .ireel img, .intro .itext { animation:none } }
  .intro.still .ireel img { animation:none; opacity:.28 }

  /* ── 跑馬燈 ───────────────────────────────────────────────
     作品介紹＋每一幅的題名與年份。⛔ 內容全部來自資料，不寫宣傳詞。 */
  /* 🔴 自己帶一條底：字色是深墨，在米色的地圖上看得見，一壓到下方深色的年代列
     或海面就整段消失（實測過）。⇒ 跑馬燈有自己的帶狀底與淺色字，位置也讓開年代列。 */
  #ticker { position:fixed; left:0; right:0; bottom:108px; z-index:4; overflow:hidden;
    white-space:nowrap; pointer-events:auto; font-size:11.5px; letter-spacing:.04em;
    color:var(--land); background:#0e2233cc; padding:5px 0;
    border-top:1px solid #ffffff12; border-bottom:1px solid #ffffff12; opacity:.92;
    -webkit-mask-image:linear-gradient(90deg,#0000,#000 6%,#000 94%,#0000);
            mask-image:linear-gradient(90deg,#0000,#000 6%,#000 94%,#0000) }
  #ticker .tk { display:inline-block; padding-right:2em; animation:tkrun var(--tk-dur,300s) linear infinite }
  #ticker:hover .tk { animation-play-state:paused }      /* 想看清楚就停在那裡 */
  #ticker em { font-style:normal; opacity:.4; margin:0 1.1em }
  #ticker i { font-style:normal; opacity:.55 }
  @keyframes tkrun { from { transform:translateX(0) } to { transform:translateX(-50%) } }
  @media (prefers-reduced-motion:reduce) { #ticker .tk { animation:none } }
  body.panel-open #ticker { display:none }
  /* 手機：HUD 會折成好幾列（實測 123px 高），寫死 top 就會被壓在底下 ⇒ 量出來再放。 */
  @media (max-width:700px) {
    #ticker { bottom:auto; top:calc(var(--hud-h,44px) + 6px); font-size:11px }
  }

  /* 畫卷：收到的景連成一卷，由右往左展讀（row-reverse）。同東海道那一作的繪卷，
     也同這批版畫本來的樣子——《清親畫帖》是冊子，翻的方向就是右起。 */
  .scroll-view { position:fixed; inset:0; z-index:25; background:#0b1723;
                 display:flex; flex-direction:column }
  .scroll-view .sbar { display:flex; align-items:center; gap:12px; padding:10px 14px }
  .scroll-view .sbar button { font-family:inherit; font-size:13px; cursor:pointer;
    background:none; color:var(--land); border:1px solid #ffffff33; border-radius:6px;
    padding:5px 14px }
  .scroll-view .sbar button:hover { border-color:#ffffff66 }
  .scroll-view .stip { font-size:11.5px; opacity:.5; margin-right:auto }
  .scroll-view .sbar [data-act="close"] { border:0; font-size:18px; opacity:.7 }
  .sroll { flex:1; display:flex; flex-direction:row-reverse; align-items:center;
           overflow-x:auto; overflow-y:hidden; gap:0;
           background:linear-gradient(#cbbb98, var(--land) 8%, var(--land) 92%, #cbbb98) }
  .sroll { cursor:grab }
  .sroll:active { cursor:grabbing }
  .sroll .span { flex:0 0 auto; position:relative; cursor:pointer }
  .sroll .span img { height:min(64vh,620px); display:block; border-left:2px solid #2b2c2c38 }
  .sroll.pixel .span img { image-rendering:pixelated }
  /* 還沒收的留一格白紙：卷長不隨進度變，才看得出還差哪幾幅 */
  .sroll .span.blank { width:min(42vh,410px); height:min(64vh,620px);
    background:repeating-linear-gradient(-45deg,#0000 0 12px,#2b2c2c0c 12px 24px);
    border-left:2px solid #2b2c2c38; display:grid; place-items:center; cursor:default }
  .sroll .syet { font-size:12px; color:#2b2c2c66; letter-spacing:.3em }
  .sroll .slabel { position:absolute; top:10px; right:10px; writing-mode:vertical-rl;
    font-size:13px; font-weight:normal; letter-spacing:.12em; color:var(--ink);
    background:#e6d8b7ee; border:1px solid #2b2c2c55; border-radius:2px; padding:6px 3px }
  .sroll .span.blank .slabel { position:static; writing-mode:vertical-rl; opacity:.55 }
  /* 卷軸兩端的軸木 */
  .sroll .jiku { flex:0 0 22px; height:min(68vh,660px); margin:0 10px;
                 background:linear-gradient(90deg,#2c211a,#4a3a2e,#2c211a); border-radius:11px }
  @media (max-width:640px) {
    .sroll .span img, .sroll .span.blank { height:min(52vh,420px) }
    .scroll-view .stip { display:none }
  }

  /* 事件卡與結局。壓在正中央，看完才回地圖——它們一場只出現一次 */
  #card { position:fixed; inset:0; display:none; place-items:center; z-index:20;
          background:#0a1622d9; padding:20px }
  #card.on { display:grid }
  #card #card-body { max-width:520px; text-align:center; line-height:1.9 }
